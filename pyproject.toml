[project]
name = "vtk"
version = "0.2.0"
description = "VLESS Toolkit — parse, convert proxy links & subscriptions"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pycryptodome>=3.23.0",
    "cryptography>=50.0.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
bot = [
    "aiogram>=3.31.0",
]
web = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[project.scripts]
vtk = "cli.main:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "bot*", "web*"]

# Bundled runtime data: RSA keymat (happ/incy decryptors) and test vectors.
[tool.setuptools.package-data]
core = ["../data/*.json"]
web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PERF"]
ignore = [
    "RUF001",  # Cyrillic/emoji strings in node names — intentional
    "RUF002",  # docstrings legitimately contain en-dashes/units
    "RUF003",  # same, in comments
    "RUF100",  # noqa for non-enabled codes (BLE001) stays as documentation
]

[tool.ruff.lint.per-file-ignores]
# Long base64 RSA key blobs — lines must stay single-string-literal
"core/happdecrypt.py" = ["E501"]
# Tests: module-level fixtures opened once; occasionally long dict literals
"tests/*" = ["SIM115", "E501", "E402"]

[tool.ruff.format]
quote-style = "double"
